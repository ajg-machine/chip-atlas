<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
        
        <title>ChIP Atlas</title>
        <link rel="icon" href="https://cdn.jsdelivr.net/gh/ajg-machine/static@main/images/favicon.ico">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ajg-machine/static@main/fonts/Helvetica/Helvetica Now/Variable/font.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ajg-machine/static@main/fonts/Helvetica/Helvetica Monospaced/font.css">

        <script async src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

        <style>

            html { -webkit-text-size-adjust: 100%; }
            body { padding: 0; margin: 0; }
            
            :root {
                --font-size: 14px;
                --line-height: 1.2;
                --font-weight: 400;
                --font-weight-bold: 700;
                --font-family: "Helvetica Now", "Roboto Flex", system-ui, sans-serif;
                --font-family-mono: "Helvetica Monospaced", "Roboto Mono", ui-monospace, monospace;
                --font-family-condensed: "Roboto Condensed", system-ui, sans-serif;
                --accent-color: oklch(58.8% 0.158 241.966);
                --desaturated-color: oklch(70.7% 0.022 261.325);
                --highly-desaturated-color: oklch(92.8% 0.006 264.531);
                --desaturated-accent-color: oklch(73.941% 0.08383 246.922);
                --shadow-color: rgba(0, 0, 0, 0.12);
                --error-color: oklch(58.6% 0.253 17.585);
                --valid-color: oklch(59.6% 0.145 163.225);
            }

            main {
                font-family: var(--font-family);
                font-size: var(--font-size);
                font-weight: var(--font-weight);
                line-height: var(--line-height);
                min-width: 1200px;

                font-variation-settings: "opsz" 22;
            }

            a {
                text-decoration: none;
                cursor: pointer;
            }
            a:not(.only-colored-on-hover) {
                color: var(--accent-color);
            }
            a:hover {
                color: var(--accent-color);
            }
            a:hover:not(.no-underline) {
                text-decoration: underline;
            }
            a.desaturated-color {
                color: var(--desaturated-accent-color);
            }

            .markdown h3 {
                font-size: var(--font-size);
            }
            .markdown ul, .markdown ol {
                padding-inline-start: 1.5em;
            }
            .markdown h3, .markdown p, .markdown ul, .markdown ol {
                margin-block-start: 5px;
                margin-block-end: 5px;
            }
            .markdown h3:not(:first-child) {
                margin-block-start: 10px;
            }
            .markdown > :first-child, .markdown > :last-child {
                margin-block-start: 0px;
                margin-block-end: 0px;
            }

            .appear-smoothly {
                animation: appearSmoothly 0.4s ease;
            }
            @keyframes appearSmoothly {
                from { opacity: 0; }
                to { opacity: 1; }
            }

            .checkbox {
                cursor: pointer;
                display: flex;
                align-items: center;
            }
            .checkbox:hover {
                color: var(--accent-color);
            }
            .checkbox::before {
                color: var(--accent-color);
                padding-right: 3px;
            }
            .checkbox[data-checked="true"]::before {
                font-family: "Material Symbols Outlined";
                content: "check";
            }
            .checkbox:not([data-checked="true"])::before {
                font-family: "Material Symbols Outlined";
                content: "close";
                color: var(--desaturated-color);
            }
            .checkbox[data-radio="true"][data-checked="true"]::before {
                font-family: "Material Symbols Outlined";
                content: "circle_circle";
                font-variation-settings: 'FILL' 1;
            }
            .checkbox[data-radio="true"]:not([data-checked="true"])::before {
                font-family: "Material Symbols Outlined";
                content: "circle";
                color: var(--desaturated-color);
            }

            .symbol-left, .symbol-right {
                cursor: pointer;
                display: flex;
                align-items: center;
            }
            .symbol-left::before {
                content: attr(data-symbol);
                font-family: "Material Symbols Outlined";
                padding-right: 3px;
                font-size: 95%;
                display: inline-block;
                text-decoration: none !important;
            }
            .symbol-right::after {
                content: attr(data-symbol);
                font-family: "Material Symbols Outlined";
                padding-left: 3px;
                font-size: 95%;
                display: inline-block;
                text-decoration: none !important;
            }
            .symbol-left.symbol-colored::before, .symbol-right.symbol-colored::after {
                color: var(--accent-color);
            }

            select {
                appearance: base-select;
                font: inherit;
                line-height: var(--line-height);
                border: none;
                margin: 0;
                padding: 0;
                background: none;
                min-height: 0;
                box-sizing: content-box;
                cursor: pointer;
                gap: 3px;
            }
            select:hover {
                color: var(--accent-color);
            }
            select::picker-icon {
                content: "keyboard_arrow_down";
                font-family: "Material Symbols Outlined";
            }
            select:open::picker-icon {
                content: "keyboard_arrow_up";
                font-family: "Material Symbols Outlined";
            }
            select::picker(select) {
                appearance: base-select;
                margin-top: 6px;
                margin-bottom: 6px;
                padding: 12px 12px 12px 4px;
                /* box-shadow: 0 6px 12px -6px var(--desaturated-color); */
                box-shadow: 4px 4px 0 var(--shadow-color);

                opacity: 0;
                transform: translateY(-6px);
                transition:
                    opacity 0.08s ease,
                    transform 0.08s ease,
                    display 0.08s allow-discrete,
                    overlay 0.08s allow-discrete;
                transform-origin: top center;

            }
            select:open::picker(select) {
                opacity: 1;
                transform: translateY(0);
            }
            @starting-style {
                select:open::picker(select) {
                    opacity: 0;
                    transform: translateY(-6px);
                }
            }
            select option {
                gap: 3px;
            }
            select option::checkmark {
                content: "check";
                font-family: "Material Symbols Outlined";
                color: var(--accent-color);
            }
            select option:hover {
                color: var(--accent-color);
                background: none;
            }
            
            #explorer {
                display: grid;
                grid-template-columns: 600px 1fr;
                height: 100dvh;
                position: relative;
            }

            #loading-overlay {
                position: absolute;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                gap: 10px;
                justify-content: flex-start;
                align-items: center;
                background-color: rgba(255, 255, 255, 0.6);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
                z-index: 999;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.2s ease, visibility 0s linear 0.2s;
            }
            #loading-overlay::before {
                content: "";
                flex: 0 0 calc(33.33% - 10px);
            }
            #loading-overlay.visible {
                opacity: 1;
                visibility: visible;
                transition: opacity 0.2s ease, visibility 0s linear 0s;
            }
            #loading-overlay > div:nth-child(2) {
                color: var(--error-color);
            }

            #samples-list-wrapper {
                overflow-y: auto;
                overflow-x: auto;
                padding: 20px;
            }
            #samples-list {
                display: grid;
                grid-template-columns: repeat(4, max-content);
                column-gap: 20px;
                row-gap: 10px;
            }
            #samples-list > div {
                display: contents;
            }
            #samples-list > div:not(:nth-child(1)):hover {
                color: var(--accent-color);
            }
            #samples-list > div:nth-child(1) {
                font-weight: var(--font-weight-bold);
            }
            #samples-list > div:nth-child(1) > div {
                display: flex;
                flex-direction: row;
                align-items: center;
                column-gap: 5px;
                
                position: sticky;
                top: 0;
                background: white;
                z-index: 2;
                padding-bottom: 5px;
            }
            #samples-list > div:nth-child(1) > div::before {
                content: "";
                position: absolute;
                top: -20px;
                left: 0;
                width: 100%;
                height: 20px;
                background: white;
            }
            #samples-list > div > div {
                min-width: 40px;
                max-width: 280px;
            }
            #samples-list > div:not(div:nth-child(1)) > div > div:nth-child(2) {
                font-size: 85%;
                color: var(--desaturated-color);
            }
            #samples-list > div:nth-child(1) > div,
            #samples-list > div > div:nth-child(1) {
                cursor: pointer;
            }

            #panel {
                border-left: 1px solid black;
                position: sticky;
                top: 0px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto 1fr;
                height: 100dvh;
            }
            #panel > div:nth-child(1) {
                grid-area: 1 / 1 / 2 / 3;
            }
            #panel > div:nth-child(2) {
                grid-area: 2 / 1 / 3 / 2;
            }
            #panel > div:nth-child(3) {
                grid-area: 2 / 2 / 3 / 3;
            }

            #controls {
                padding-bottom: 10px;
                padding-bottom: 20px;
                border-bottom: 1px solid black;
                padding: 20px;
                display: flex;
                flex-direction: column;
                row-gap: 10px;
            }

            #controls .control-title {
                font-weight: var(--font-weight-bold);
            }

            #controls > :not(#search-control) {
                display: flex;
                flex-direction: row;
                column-gap: 10px;
            }

            #search-control {
                display: grid;
                grid-template-columns: max-content auto max-content;
                column-gap: 10px;
                border-bottom: 1px solid var(--highly-desaturated-color);
                padding-bottom: 3px;
            }

            #search-control:hover,
            #search-control:focus-within {
                border-bottom: 1px solid var(--accent-color);
            }

            #search-control #search {
                outline: none;
            }

            #listing {
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }
            #listing > div:nth-child(1) {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
                padding: 20px;
                border-bottom: 1px dotted black;
                position: sticky;
                top: 0;
                background: white;
            }
            #listing > div:nth-child(1) > div {
                text-decoration: underline;
                text-underline-offset: 0.5em;
            }
            #listing > div:nth-child(1) > div[data-selected="true"] {
                text-decoration-thickness: 2px;
                text-underline-offset: calc(0.5em - 1px);
            }
            #listing > div:nth-child(1) > div:not([data-selected="true"]) {
                cursor: pointer;
                text-decoration-color: var(--highly-desaturated-color);
            }
            #listing > div:nth-child(1) > div:not([data-selected="true"]):hover {
                color: var(--accent-color);
                text-decoration-color: var(--accent-color);
            }
            #listing > div:nth-child(2) {
                display: flex;
                flex-direction: column;
                gap: 15px;
                word-break: break-word;
                padding: 20px;
            }
            #listing > div:nth-child(2) > div {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            #listing > div:nth-child(2) > div :empty {
                display: none;
            }
            #listing > div:nth-child(2) > div > :nth-child(1) > :nth-child(1) {
                font-weight: var(--font-weight-bold);
                margin-right: 10px;
            }
            #listing > div:nth-child(2) > div > :nth-child(2) {
                font-size: 85%;
                color: var(--desaturated-color);
            }

            #full-sample {
                display: flex;
                flex-direction: column;
                border-left: 1px solid black;
                overflow-y: auto;
            }
            #full-sample > .control {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
                padding: 20px;
                border-bottom: 1px dotted black;
                position: sticky;
                top: 0;
                background: white;
            }
            #full-sample > .control [data-selected="true"] {
                text-decoration: underline;
                text-decoration-thickness: 2px;
                text-underline-offset: calc(0.5em - 1px);
            }
            #full-sample > .control [data-selected="false"] > span {
                text-decoration: underline;
                text-underline-offset: 0.5em;
                text-decoration-color: var(--highly-desaturated-color);
            }
            #full-sample > .control [data-selected="false"] > span:hover {
                color: var(--accent-color);
                text-decoration-color: var(--accent-color);
            }
            #full-sample > .sections {
                display: flex;
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            #full-sample .section {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            #full-sample .section:empty {
                display: none;
            }
            #full-sample .section:not(:first-child)::before {
                content: "";
                border-bottom: 1px solid var(--highly-desaturated-color);
                margin-bottom: 10px;
            }

            #full-sample .key-value-pair > :first-child {
                display: inline;
                font-weight: var(--font-weight-bold);
            }
            #full-sample .key-value-pair > :nth-child(2) {
                display: inline;
                margin-right: calc(10px - 0.25em);
            }
            #full-sample .key-value-pair > :nth-child(3) {
                display: inline;
            }
            #full-sample .key-value-pair > :nth-child(3) > :not(:last-child) {
                margin-right: 10px;
            }
            #full-sample .key-value-pair > :empty {
                display: none;
            }

            #download-control {
                cursor: pointer;
            }
            #download-control:hover {
                color: var(--accent-color);
            }
            #download-control[data-error="true"]::before {
                color: var(--error-color);
            }

            #download-modal {
                display: none;
                position: absolute;
                inset: 0;
                z-index: 1000;
                justify-content: center;
                align-items: center;
                background-color: rgba(255, 255, 255, 0.6);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
            }
            #download-modal[data-visible="true"] {
                display: flex;
            }
            #download-modal > .panel {
                display: flex;
                flex-direction: column;
                width: 50dvw;
                max-height: 66dvh;
                background: white;
                border: 1px solid black;
                box-shadow: 4px 4px 0 var(--shadow-color);
            }
            #download-modal > .panel > .control {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 15px;
                padding: 20px;
                border-bottom: 1px dotted black;
            }
            #download-modal > .panel > .control > :first-child {
                font-weight: var(--font-weight-bold);
                margin-right: auto;
            }
            #download-modal > .panel > .control > :not(:first-child):hover {
                color: var(--accent-color);
            }
            #download-modal > .panel > .list {
                display: flex;
                flex-direction: column;
                gap: 15px;
                padding: 20px;
                overflow-y: auto;
            }
            #download-modal > .panel > .list:empty::after {
                content: "No downloads";
                color: var(--desaturated-color);
            }

            #download-modal .task {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            #download-modal .task > .header {
                display: flex;
                flex-direction: row;
                align-items: baseline;
                gap: 10px;
            }
            #download-modal .task > .header > .name {
                word-break: break-all;
                margin-right: auto;
            }
            #download-modal .task > .bar {
                height: 4px;
                background: var(--highly-desaturated-color);
                overflow: hidden;
            }
            #download-modal .task > .bar > div {
                width: 0%;
                height: 100%;
                background: var(--accent-color);
                transition: width 0.2s linear;
            }
            #download-modal .task[data-status="done"] > .bar > div {
                background: var(--valid-color);
            }
            #download-modal .task[data-status="error"] > .bar > div {
                background: var(--error-color);
            }
            #download-modal .task[data-status="cancelled"] > .bar > div {
                background: var(--desaturated-color);
            }
            #download-modal .task[data-indeterminate="true"] > .bar > div {
                width: 33%;
                transition: none;
                animation: downloadIndeterminate 1.2s ease-in-out infinite;
            }
            @keyframes downloadIndeterminate {
                from { transform: translateX(-110%); }
                to { transform: translateX(310%); }
            }
            #download-modal .task > .details {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 15px;
                font-size: 85%;
                color: var(--desaturated-color);
            }
            #download-modal .task > .details > .status {
                margin-right: auto;
                word-break: break-word;
                font-variant-numeric: tabular-nums;
            }
            #download-modal .task[data-status="error"] > .details > .status {
                color: var(--error-color);
            }
            #download-modal .task > .details > .cancel,
            #download-modal .task > .details > .retry,
            #download-modal .task > .details > .remove {
                display: none;
                white-space: nowrap;
            }
            #download-modal .task > .details > .cancel:hover,
            #download-modal .task > .details > .retry:hover,
            #download-modal .task > .details > .remove:hover {
                color: var(--accent-color);
            }
            #download-modal .task[data-status="downloading"] > .details > .cancel,
            #download-modal .task[data-status="error"] > .details > .retry,
            #download-modal .task[data-status="cancelled"] > .details > .retry,
            #download-modal .task:not([data-status="downloading"]) > .details > .remove {
                display: flex;
            }

        </style>
    </head>
    <body>
        <main>

            <div id="explorer">
                <div id="samples-list-wrapper">
                    <div id="samples-list"></div>
                </div>
                <div id="panel">
                    <div id="controls">
                        <div>
                            <div class="control-title">Display</div>
                            <div
                                class="checkbox"
                                id="toggle-summaries"
                                onclick="databaseControl('toggle-summaries')"
                                data-checked="true"
                                title="Toggle display of entries summaries in listing"
                            >Summaries</div>
                            <div
                                class="symbol-left symbol-colored"
                                id="download-control"
                                data-symbol="download"
                                onclick="STATE.downloader.showModal()"
                                title="Show downloads"
                            ><span id="current-download-count"></span><span id="current-download-label">Downloads</span></div>
                        </div>
                        <div id="genome-control">
                            <div class="control-title">Genome</div>
                        </div>
                        <div id="search-fields-control">
                            <div class="control-title">Search in</div>
                            <div class="checkbox" data-checked="true" data-search-in="ids" title="Samples GSE, GSM, SRX...">IDs</div>
                            <div class="checkbox" data-checked="true" data-search-in="target" title="Samples target">Target</div>
                            <div class="checkbox" data-checked="true" data-search-in="cell" title="Samples cell">Cell</div>
                            <div
                                class="checkbox"
                                data-checked="true"
                                data-search-in="aliases"
                                title="Aliases for targets and cells (only if also selected)"
                            >Aliases</div>
                            <div class="checkbox" data-search-in="date" title="Samples date">Date</div>
                            <div class="checkbox" data-search-in="title" title="Sample submission title">Title</div>
                            <div class="checkbox" data-search-in="attributes" title="Sample attributes">Attributes</div>
                        </div>
                        <div id="search-control" title='Search terms, may includes modifiers and/or/xor/not, eg: "att20 pax7" "att20 (or: pax7 tpit)" "(and: att20 (or: pax7 tpit) (not: SRX2463201))"'>
                            <div class="control-title">Search</div>
                            <div id="search" contenteditable="plaintext-only" oninput="searchSamples()"></div>
                            <div id="search-count"></div>
                        </div>
                    </div>
                    <div id="listing"></div>
                    <div id="full-sample"></div>
                </div>
                <div id="download-modal">
                    <div class="panel">
                        <div class="control">
                            <div>Downloads</div>
                            <div class="symbol-left symbol-colored" id="download-modal-clear" data-symbol="delete_sweep">Clear finished</div>
                            <div class="symbol-left symbol-colored" id="download-modal-close" data-symbol="close">Close</div>
                        </div>
                        <div class="list"></div>
                    </div>
                </div>
                <div id="loading-overlay" class="visible">
                    <div></div>
                    <div></div>
                </div>
            </div>



        </main>
        <script>
"use strict";

let BASE_URL = "https://cdn.jsdelivr.net/gh/ajg-machine/chip-atlas@main";
let STATE = {
    downloader: null,
    downloadBaseName: entry => `${entry[6].match(/^([^(]*).*$/)[1].trim()}_${entry[5].match(/^([^(]*).*$/)[1].trim()}_${entry[2]}`,
    genome: {selected: "mm10", available: null},
    database: {},
    targetsSummaries: {},
    cellsSummaries: {},
    targetsAliasesInserted: {},
    cellsAliasesInserted: {},
    display: {
        summaries: true,
        showStep: 400,
        listing: "targets",
        fullSampleSummaryFor: "target",
    },
    current: {
        searchTask: null,
        genome: null,
        search: null,
        samples: {div: null, list: null, count: null},
        listing: {div: null, target: null, list: null, count: null},
    },
    infiniteScrolling: {
        samples: null,
        listing: null,
    },
    fullInfo: {back: [], forward: []},
    sort: {by: 7, reverse: true},
    fetchHistory: new Map(),
};


function formatNumber(number, {notation="full", precision=null, thousands=null}={}) {
    let suffix = "";
    if (notation === "si") {
        if (number !== 0) {
            let absNumber = Math.abs(number);
            let exponent = Math.floor(Math.log10(absNumber) / 3);
            let scaled;
            if (exponent >= 0) {
                let suffixes = ["", "k", "M", "G", "T", "P", "E"];
                let index = Math.min(exponent, suffixes.length - 1);
                scaled = absNumber / Math.pow(1000, index);
                suffix = ` ${suffixes[index]}`;
            } else {
                let suffixes = ["", "m", "μ", "n", "p"];
                let index = Math.min(-exponent, suffixes.length - 1);
                scaled = absNumber * Math.pow(1000, index);
                suffix = ` ${suffixes[index]}`;
            }
            number = ((number < 0) ? -1 : 1) * scaled;
        }
    } else if (notation === "scientific" || notation === "sci") {
        if (number !== 0) {
            let exponent = Math.floor(Math.log10(Math.abs(number)));
            number /= Math.pow(10, exponent);
            suffix = `e${exponent}`;
        }
    } else if (notation !== "full") {
        throw new Error(`unknown notation: ${notation}`);
    }
    if (precision !== null) {
        const rounded = Math.round(Number(number) / precision) * precision;
        const decimals = (precision >= 1) ? 0 : Math.max(0, Math.ceil(-Math.log10(precision)));
        number = rounded.toFixed(decimals);
    } else {
        number = number.toString();
    }
    if (thousands !== null && !/[eE]/.test(number)) {
        let neg = number.startsWith("-") ? "-" : "";
        if (neg) number = number.slice(1);
        let parts = number.split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, thousands);
        number = neg + parts.join(".");
    }
    return `${number}${suffix}`;
}


function romanToArabic(roman) {
    let romanNumerals = {
        'i': 1, 'v': 5, 'x': 10, 'l': 50,
        'c': 100, 'd': 500, 'm': 1000
    };
    roman = roman.toLowerCase();
    let result = 0;
    for (let i = 0; i < roman.length; i++) {
        let current = romanNumerals[roman[i]];
        let next = romanNumerals[roman[i + 1]];
        if (!current) throw new Error(`invalid roman numeral character: ${roman[i]}`);
        if (next && current < next) {
            result -= current;
        } else {
            result += current;
        }
    }
    
    return result;
}


function arabicToRoman(num) {
    if (num <= 0 || num >= 4000) {
        throw new Error('number must be between 1 and 3999');
    }
    let values = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
    let numerals = ['m', 'cm', 'd', 'cd', 'c', 'xc', 'l', 'xl', 'x', 'ix', 'v', 'iv', 'i'];
    let result = '';
    for (let i = 0; i < values.length; i++) {
        while (num >= values[i]) {
            result += numerals[i];
            num -= values[i];
        }
    }
    return result;
}


async function fetchUrl(url, {decompress=null, cache="read+write", ...options}={}) {
    if (options.cache == null) options.cache = "no-cache";
    let cacheKey = JSON.stringify([url, options]);
    let response;
    if (cache.includes("read") && STATE.fetchHistory.has(cacheKey)) {
        let cachedResponse = STATE.fetchHistory.get(cacheKey);
        if (Date.now() - cachedResponse.date > 10 * 60 * 1000) {
            STATE.fetchHistory.delete(cacheKey);
        } else {
            response = cachedResponse.response.clone();
        }
    }
    if (STATE.fetchHistory.size > 200) {
        let keys = Array.from(STATE.fetchHistory.keys());
        for (let key of keys.slice(0, 100)) {
            STATE.fetchHistory.delete(key);
        }
    }
    if (!response) response = await fetch(url, options);
    if (!response.ok) throw new Error(response);
    if (cache.includes("write")) {
        let cachedResponse = {date: Date.now(), response: response.clone()};
        STATE.fetchHistory.set(cacheKey, cachedResponse);
    }
    if (decompress) {
        let decompressionStream = new DecompressionStream(decompress);
        let decompressedStream = response.body.pipeThrough(decompressionStream);
        response = new Response(decompressedStream);
    }
    return response;
}

function getEntryTargetName(name) {
    return name.toLowerCase().match(/^([^(]*).*$/)[1].replace(/[^\w()]+/g, "");
}


async function getTargetsSummaries({genome}={}) {
    if (STATE.targetsSummaries[genome] != null) return STATE.targetsSummaries[genome];
    STATE.targetsSummaries[genome] = new Promise(async (resolve, reject) => {
        try {
            let url = `${BASE_URL}/summaries/targets/${genome}.json.gz`;
            let data = {};
            try {
                let response = await fetchUrl(url, {decompress: "gzip"});
                data = await response.json();
            } catch (e) {
                console.error(`No targets summaries for genome ${genome}`);
            }
            let targetsSummaries = new Map();
            for (let [name, entryData] of Object.entries(data)) {
                let minimalName = getEntryTargetName(name);
                entryData.name = name;
                entryData.minimalName = minimalName;
                entryData.aliases = entryData.aliases
                    .filter(alias => getEntryTargetName(alias) !== minimalName);
                targetsSummaries.set(minimalName, entryData);
            }
            if (!STATE.targetsAliasesInserted[genome]) {
                let database = await getDatabase({genome});
                for (let entry of database) {
                    let minimalName = getEntryTargetName(entry[6][0]);
                    let summary = targetsSummaries.get(minimalName);
                    if (!summary) continue;
                    let aliases = [summary.name, summary.full_name, ...summary.aliases]
                        .map(getEntryTargetName);
                    entry[11][1] = (entry[11][1] ? entry[11][1] + " " : "") + aliases.join(" ");
                }
                STATE.targetsAliasesInserted[genome] = true;
            }
            resolve(targetsSummaries);
        } catch (e) {
            reject(e);
        }
    });
    return STATE.targetsSummaries[genome];
}

function packCrossref(crossref, runs=false) {
    if (runs) return crossref.runs.join(" ");
    return [
        crossref.bioproject,
        crossref.biosample,
        crossref.geoSample,
        crossref.geoSeries,
        crossref.sample,
        crossref.study,
        crossref.submission,
    ].join(" ");
}
function unpackCrossref(packedCrossref, runs=false) {
    if (runs) return packedCrossref.split(" ");
    let [bioproject, biosample, geoSample, geoSeries, sample, study, submission] = packedCrossref.split(" ");
    return {bioproject, biosample, geoSample, geoSeries, sample, study, submission};
}


async function getDatabase({genome}={}) {
    genome = genome.toLowerCase();
    if (STATE.database[genome]) return STATE.database[genome];
    STATE.database[genome] = new Promise(async (resolve, reject) => {
        try {
            let file = `${genome}.v2.tsv.gz`;
            let url = `${BASE_URL}/database/genomes/${file}`;
            let response = await fetchUrl(url, {decompress: "deflate"});
            let data = await response.text();
            // 12 -> 2 others columns added at the end for targets and cells aliases
            let lines = data.trimEnd().split("\n");
            data = new Array(lines.length);
            // TSV columns (source order): 0 crossref, 1 runs, 2 srx, 3 genome,
            // 4 cell, 5 target, 6 date, 7 title, 8 logs, 9 attributes.
            // Row columns (app order): 0 crossref ids, 1 display id, 2 srx,
            // 3 srr, 4 genome, 5 cell, 6 target, 7 date, 8 title, 9 logs,
            // 10 attributes, 11 target aliases, 12 cell aliases.
            for (let i = 0; i < lines.length; i++) {
                let cols = lines[i].split("\t");
                // [display, searchable] for a plain text column
                let std = (s) => [s, s.toLowerCase().replace(/[^\w()]+/g, "")];

                let crossref = unpackCrossref(cols[0]);
                let displayId = crossref.geoSeries || crossref.bioproject || "?";

                let row = new Array(13);
                row[0]  = [crossref, cols[0].toLowerCase()];                      // crossref ids (object)
                row[1]  = [displayId, displayId.toLowerCase()];                   // primary display id
                row[2]  = std(cols[2]);                                           // srx (experiment, unique key)
                row[3]  = [unpackCrossref(cols[1], true), cols[1].toLowerCase()]; // srr (runs)
                row[4]  = std(cols[3]);                                           // genome
                row[5]  = std(cols[4]);                                           // cell
                row[6]  = std(cols[5]);                                           // target
                row[7]  = [cols[6], cols[6].replace(/\D+/g, " ")];                // date
                row[8]  = std(cols[7]);                                           // title
                row[9]  = std(cols[8]);                                           // logs
                row[10] = [cols[9], cols[9]                                       // attributes
                    .toLowerCase()
                    .split(/[;=]/)
                    .map(y => y.replace(/[^\w()]+/g, ""))
                    .join(" ")
                ];
                row[11] = ["", ""];   // target aliases (filled in by getTargetsSummaries)
                row[12] = ["", ""];   // cell aliases (filled in by getCellsSummaries)
                data[i] = row;
            }
            resolve(data);
        } catch (e) {
            reject(e);
        }
    });
    return STATE.database[genome];
}


function searchSamples() {
    return new Promise((resolve, reject) => {
        if (STATE.current.searchTask) clearTimeout(STATE.current.searchTask);
        STATE.current.searchTask = setTimeout(async () => {
            let loadingOverlayDiv = document.querySelector("#loading-overlay");
            if (STATE.genome.selected !== STATE.current.genome) {
                loadingOverlayDiv.children[0].textContent = `Loading genome ${STATE.genome.selected}`;
                loadingOverlayDiv.children[1].textContent = "";
                loadingOverlayDiv.classList.add("visible");
            }
            try {
                await initSearchSamples();
                loadingOverlayDiv.classList.remove("visible");
                resolve();
            } catch (e) {
                loadingOverlayDiv.children[1].textContent = `ERROR /// ${e.message}`;
                setTimeout(() => {
                    loadingOverlayDiv.classList.remove("visible");
                }, 5000);
                reject(e);
            }
        }, 0);
    });
}

async function initSearchSamples() {
    let genome = STATE.genome.selected;
    let database = getDatabase({genome});
    let targetsSummaries = getTargetsSummaries({genome});
    let cellsSummaries = getCellsSummaries({genome});
    database = await database;
    targetsSummaries = await targetsSummaries;
    cellsSummaries = await cellsSummaries;
    let searchIndexes = {
        ids: [0, 2, 3],
        target: [6],
        cell: [5],
        aliases: [11, 12],
        date: [7],
        title: [8],
        attributes: [10],
    };
    let searchFields = Array.from(document.querySelectorAll("#search-fields-control > div[data-checked='true']"))
        .map(div => div.dataset.searchIn.split(",").map(x => x.trim().toLowerCase()))
        .flat();
    searchFields = new Set(searchFields);
    let searchFieldsIndexes = [];
    for (let field of searchFields) {
        if (field === "aliases") {
            if (searchFields.has("target")) searchFieldsIndexes.push(searchIndexes[field][0]);
            if (searchFields.has("cell")) searchFieldsIndexes.push(searchIndexes[field][1]);
        } else {
            searchFieldsIndexes.push(...searchIndexes[field]);
        }
    }
    searchFieldsIndexes.sort((a, b) => a - b);

    // Parse query string into a tree structure
    let parseSearchQuery = (str) => {
        str = str.trim();
        
        // Check if it's wrapped in parentheses with an operator
        let strMatch = str.match(/^\(\s*(and|or|xor|not):\s*(.+?)\s*\)$/i);
        if (strMatch) {
            let [operator, content] = [strMatch[1].toLowerCase(), strMatch[2]];
            return {type: operator, children: parseSearchQueryList(content)};
        }
        
        // Check if it's wrapped in parentheses without an operator (default to AND)
        if (str.match(/^\(.+\)$/)) {
            let content = str.slice(1, -1).trim();
            return {type: "and", children: parseSearchQueryList(content)};
        }
        
        // Check if multiple terms without parentheses (default to AND)
        if (/\s/.test(str)) {
            return {type: "and", children: parseSearchQueryList(str)};
        }

        // Single term (no parentheses or operator)
        let normalized = str
            .toLowerCase()
            .replace(/[^\w()]+/g, "");

        // Handle pol1-9 to roman numerals - create OR with both versions
        let polMatch = normalized.match(/^pol(\d+)$/);
        if (polMatch) {
            let x = polMatch[1];
            let roman = arabicToRoman(Number(x)).toLocaleLowerCase();
            let romanForm = `rnapolymerase${roman}`;
            return {
                type: "or",
                children: [
                    {type: "term", value: normalized},
                    {type: "term", value: romanForm}
                ]
            };
        }
        return {type: "term", value: normalized};
    };
    
    let parseSearchQueryList = (str) => {
        let terms = [];
        let depth = 0;
        let current = "";
        for (let i = 0; i < str.length; i++) {
            let char = str[i];
            if (char === "(") {
                depth++;
                current += char;
            } else if (char === ")") {
                depth--;
                current += char;
            } else if (char === " " && depth === 0) {
                if (current.trim().length > 0) {
                    terms.push(parseSearchQuery(current.trim()));
                    current = "";
                }
            } else {
                current += char;
            }
        }
        if (current.trim().length > 0) {
            terms.push(parseSearchQuery(current.trim()));
        }
        return terms;
    };
    
    // Compile query tree once into a specialized sample => boolean predicate.
    // Done once per search (not per row), so no per-row type dispatch or
    // closure allocation happens inside the database.filter() hot loop.
    let compileSearchQuery = (query) => {
        if (query.type === "term") {
            let value = query.value;
            let idxs = searchFieldsIndexes;
            let n = idxs.length;
            return (sample) => {
                for (let i = 0; i < n; i++) {
                    if (sample[idxs[i]][1].includes(value)) return true;
                }
                return false;
            };
        }
        let children = query.children.map(compileSearchQuery);
        let n = children.length;
        if (query.type === "and") {
            return (sample) => {
                for (let i = 0; i < n; i++) if (!children[i](sample)) return false;
                return true;
            };
        } else if (query.type === "or") {
            return (sample) => {
                for (let i = 0; i < n; i++) if (children[i](sample)) return true;
                return false;
            };
        } else if (query.type === "xor") {
            return (sample) => {
                let count = 0;
                for (let i = 0; i < n; i++) {
                    if (children[i](sample) && ++count > 1) return false;
                }
                return count === 1;
            };
        } else if (query.type === "not") {
            // matches when NOT all children match (i.e. at least one fails)
            return (sample) => {
                for (let i = 0; i < n; i++) if (!children[i](sample)) return true;
                return false;
            };
        }
        return () => false;
    };

    // Parse the query string
    let searchQuery = document.querySelector("#search").textContent;
    searchQuery = searchQuery.trim();

    // Signature of this search, used to decide whether the previous result
    // list can be reused as the filter source instead of the full database.
    let fieldsKey = searchFieldsIndexes.join(",");
    let flat = searchQuery.length > 0 && !/[()]/.test(searchQuery);
    let terms = flat
        ? searchQuery.split(/\s+/).map(t => t.toLowerCase().replace(/[^\w]+/g, "")).filter(Boolean)
        : [];

    let results;
    if (searchQuery.length === 0) {
        results = Array.from(database);
    } else {
        let matchFn = compileSearchQuery(parseSearchQuery(searchQuery));
        // Reuse the previous (smaller) result list instead of scanning the
        // whole database when the new search is provably a subset of it:
        //   - same genome and same search fields, and
        //   - both queries are flat conjunctions (no ( ) grouping / operators), and
        //   - every previous term is a substring of some new term, i.e. each old
        //     conjunct is implied by a new one, so newMatch(s) => oldMatch(s).
        let prev = STATE.current.search;
        let canNarrow = prev && prev.list
            && prev.genome === genome
            && prev.fieldsKey === fieldsKey
            && prev.flat && flat
            && prev.terms.every(ot => terms.some(nt => nt.includes(ot)));
        let source = canNarrow ? prev.list : database;
        results = source.filter(matchFn);
    }
    
    // Sort results
    let sortFn = (a, b) => {
        if (a === "?" || b === "?") {
            if (a === "?" && b === "?") return 0;
            if (a === "?") return 1;
            return -1;
        }
        return (STATE.sort.reverse ? -1 : 1) * a.localeCompare(b);
        if (a < b) return STATE.sort.reverse ? 1 : -1;
        if (a > b) return STATE.sort.reverse ? -1 : 1;
        return 0;
    };
    if (STATE.sort.by != null) {
        results.sort((a, b) => sortFn(a[STATE.sort.by][0], b[STATE.sort.by][0]));
    }

    let sampleCount = formatNumber(results.length, {thousands: ","})
    document.getElementById("search-count").textContent = `${sampleCount} samples`;
    let samplesDiv = document.getElementById("samples-list");
    samplesDiv.textContent = "";

    let rowDiv = samplesDiv.appendChild(document.createElement("div"));
    for (let [title, sortIndex] of [["Date", 7], ["IDs", 1], ["Target", 6], ["Cell", 5]]) {
        let div = rowDiv.appendChild(document.createElement("div"));
        let titleDiv = div.appendChild(document.createElement("div"));
        div.appendChild(document.createElement("div"));
        titleDiv.textContent = title;
        div.dataset.sortIndex = sortIndex;
        if (STATE.sort.by === Number(div.dataset.sortIndex)) {
            div.children[1].textContent = STATE.sort.reverse ? "keyboard_arrow_down" : "keyboard_arrow_up";
            div.children[1].style.fontFamily = "Material Symbols Outlined";
            div.children[1].style.fontSize = "95%";
        }
        div.onclick = () => {
            if (STATE.sort.by === Number(div.dataset.sortIndex)) {
                STATE.sort.reverse = !STATE.sort.reverse;
            } else {
                STATE.sort.by = Number(div.dataset.sortIndex);
            }
            searchSamples();
        };
    }

    document.querySelector("#samples-list-wrapper").scrollTop = 0;
    STATE.current.samples.div = samplesDiv;
    STATE.current.samples.list = results;
    // Record this search so the next one can narrow from it when applicable.
    STATE.current.search = {genome, fieldsKey, flat, terms, list: results};
    STATE.current.samples.count = 0;
    await showMoreSamples();
    await initListing();

}


async function showMoreSamples() {

async function initListing() {

    let currentDatabase = STATE.current.samples.list;
    if (currentDatabase == null) return;

    // initialize targets and cells list
    let listingDiv = document.querySelector("#listing");
    listingDiv.textContent = "";

    // Update listing controls
    let uniques = {};
    let listingControlDiv = listingDiv.appendChild(document.createElement("div"));
    for (let [label, value, entryIndex] of [["Studies", "studies", 1], ["Targets", "targets", 6], ["Cells", "cells", 5]]) {
        uniques[value] = new Map();
        for (let entry of currentDatabase) {
            uniques[value].set(entry[entryIndex][0], entry);
        }
        let div = listingControlDiv.appendChild(document.createElement("div"));
        div.textContent = `${label} (${formatNumber(uniques[value].size, {thousands: ","})})`;
        div.dataset.selected = (STATE.display.listing === value) ? "true" : "false";
        //div.classList.add("symbol-left", "symbol-colored");
        //div.dataset.symbol = (STATE.display.listing === value) ? "radio_button_checked" : "radio_button_unchecked";
        div.onclick = async () => {
            if (STATE.display.listing === value) return;
            STATE.display.listing = value;
            await initListing();
        };
    }
    let listingListDiv = listingDiv.appendChild(document.createElement("div"));

    STATE.current.listing.div = listingListDiv;
    if (STATE.display.listing === "targets") {
        STATE.current.listing.target = "targets";
        STATE.current.listing.list = Array.from(uniques["targets"].values());
    } else if (STATE.display.listing === "cells") {
        STATE.current.listing.target = "cells";
        STATE.current.listing.list = Array.from(uniques["cells"].values());
    } else if (STATE.display.listing === "studies") {
        STATE.current.listing.target = "studies";
        let resultsByStudy = new Map();
        for (let entry of currentDatabase) {
            let study = entry[1][0];
            if (!uniques["studies"].has(study)) break;
            if (!resultsByStudy.has(study)) resultsByStudy.set(study, []);
            resultsByStudy.get(study).push(entry);
        }
        STATE.current.listing.list = Array.from(resultsByStudy.entries());
    } else {
        STATE.current.listing.target = null;
        STATE.current.listing.list = null;
    }
    STATE.current.listing.count = 0;

    document.querySelector("#listing").scrollTop = 0;
    await showMoreListing();

}

function setupInfiniteScroll(scrollEl, loadMore, hasMore, {threshold = 400} = {}) {
    let loading = false;
    async function check() {
        if (loading || !hasMore()) return;
        let nearBottom = scrollEl.scrollTop + scrollEl.clientHeight
                         >= scrollEl.scrollHeight - threshold;
        if (!nearBottom) return;
        loading = true;
        try {
            await loadMore();
        } finally {
            loading = false;
        }
        // Content may still be too short to scroll — re-check next frame.
        requestAnimationFrame(check);
    }
    scrollEl.addEventListener("scroll", check, {passive: true});
    return check; // call after a fresh render to fill the viewport
}



function makeKeyValueDiv(parent, {fieldClasses=[]}={}) {
    let fieldDiv = parent.appendChild(document.createElement("div"));
    for (let fieldClass of fieldClasses) {
        fieldDiv.classList.add(fieldClass);
    }
    fieldDiv.classList.add("key-value-pair");
    let keyDiv = fieldDiv.appendChild(document.createElement("div"));
    let spaceDiv = fieldDiv.appendChild(document.createElement("div"));
    let valueDiv = fieldDiv.appendChild(document.createElement("div"));
    spaceDiv.textContent = " ";
    return [keyDiv, valueDiv];
}
function fillKeyValueDivValue(div, value) {
    // string, number -> show as text
    // list -> recursively show each item seprated by commas
    // object -> recursively show as key-value pairs (key: value)
    let toString = (value) => {
        if (Array.isArray(value)) {
            return value.map(toString).join(", ");
        } else if (typeof value === "object" && value !== null) {
            let pairs = [];
            for (let [key, val] of Object.entries(value)) {
                pairs.push(`${key}: ${toString(val)}`);
            }
            return pairs.join(", ");
        } else {
            return value;
        }
    };
    div.textContent = toString(value);
}

async function toggleMoreInfo(moreInfoHeaderDiv, moreInfoDiv, div, openFunction) {
    let divOpened = div.dataset.opened === "true";
    moreInfoDiv.textContent = "";
    moreInfoHeaderDiv.querySelectorAll("a.show-hide").forEach(a => {
        a.textContent = "Show";
        a.dataset.opened = "false";
    });
    if (!divOpened) {
        div.textContent = "Hide";
        div.dataset.opened = "true";
        await openFunction();
    }
}

function initFullInfo({type, accession, isNavigation=false}={}) {
    if (!isNavigation) {
        let last = STATE.fullInfo.back[STATE.fullInfo.back.length - 1];
        let isDuplicate = last && 
            last.type === type && 
            last.accession.genome === accession.genome && 
            last.accession.key === accession.key;
        if (!isDuplicate) {
            STATE.fullInfo.back.push({type, accession});
            STATE.fullInfo.forward = [];
        }
    }
    if (STATE.fullInfo.back.length > 100) STATE.fullInfo.back = STATE.fullInfo.back.slice(50);
    if (STATE.fullInfo.forward.length > 100) STATE.fullInfo.forward = STATE.fullInfo.forward.slice(50);
    let mainDiv = document.querySelector("#full-sample");
    mainDiv.textContent = "";
    let controlDiv = mainDiv.appendChild(document.createElement("div"));
    controlDiv.classList.add("control");
    let sectionsDiv = mainDiv.appendChild(document.createElement("div"));
    sectionsDiv.classList.add("sections");
    
    if (STATE.fullInfo.back.length > 1) {
        let backDiv = controlDiv.appendChild(document.createElement("a"));
        let previous = STATE.fullInfo.back[STATE.fullInfo.back.length - 2];
        let backSpan = backDiv.appendChild(document.createElement("span"));
        backSpan.textContent = previous.accession.key;
        backDiv.classList.add("symbol-left", "no-underline", "only-colored-on-hover");
        backDiv.dataset.symbol = "keyboard_arrow_left";
        backDiv.dataset.selected = "false";
        backDiv.onclick = async () => {
            let current = STATE.fullInfo.back.pop();
            if (!current) return;
            STATE.fullInfo.forward.push(current);
            let previous = STATE.fullInfo.back[STATE.fullInfo.back.length - 1];
            if (!previous) return;
            let call =
                previous.type === "sample" ? showFullSample :
                previous.type === "target" ? showTargetSummary :
                previous.type === "cell" ? showCellSummary :
                null;
            if (call) await call({...previous.accession, isNavigation: true});
        };
    }
    
    let currentDiv = controlDiv.appendChild(document.createElement("span"));
    currentDiv.textContent = accession.key;
    currentDiv.dataset.selected = "true";

    if (STATE.fullInfo.forward.length > 0) {
        let forwardDiv = controlDiv.appendChild(document.createElement("a"));
        let next = STATE.fullInfo.forward[STATE.fullInfo.forward.length - 1];
        let forwardSpan = forwardDiv.appendChild(document.createElement("span"));
        forwardSpan.textContent = next.accession.key;
        forwardDiv.classList.add("symbol-right", "no-underline", "only-colored-on-hover");
        forwardDiv.dataset.symbol = "keyboard_arrow_right";
        forwardDiv.dataset.selected = "false";
        forwardDiv.onclick = async () => {
            let next = STATE.fullInfo.forward.pop();
            if (!next) return;
            STATE.fullInfo.back.push(next);
            let call =
                next.type === "sample" ? showFullSample :
                next.type === "target" ? showTargetSummary :
                next.type === "cell" ? showCellSummary :
                null;
            if (call) await call({...next.accession, isNavigation: true});
        };
    }
    return [mainDiv, controlDiv, sectionsDiv];
}

async function getGSMInfo({gsm}={}) {
    let url = `https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=${gsm}&targ=self&form=text`;
    let response = await fetchUrl(url);
    let data = await response.text();
    data = data.trim().split("\n")
        .map(line => line.slice(1).split("=").map(x => x.trim()))
        .map(pair => [pair[0].toLowerCase(), pair[1] || ""]);
    return data;
}


function uniquesInArray(array) {
    let seen = new Set();
    let uniqueArray = [];
    for (let item of array) {
        if (!seen.has(item)) {
            seen.add(item);
            uniqueArray.push(item);
        }
    }
    return uniqueArray;
}


let ENAUtil = (() => {

    /**
     * Parsers for ENA (European Nucleotide Archive) XML records, converting them
     * into plain JSON objects suitable for UI display.
     *
     * Both functions take the raw XML file content as a string and use the
     * browser's built-in DOMParser, so they are meant to run in a browser or
     * browser-like (e.g. artifact) environment, not Node.js directly.
     */

    /** Get the trimmed text content of the first matching child element, or null. */
    function getText(parent, tagName) {
        if (!parent) return null;
        const el = parent.getElementsByTagName(tagName)[0];
        return el ? el.textContent.trim() : null;
    }

    /** Get all matching child elements as an array (direct or nested). */
    function getAll(parent, tagName) {
        if (!parent) return [];
        return Array.from(parent.getElementsByTagName(tagName));
    }

    function parseXmlString(xmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlString, 'application/xml');
        const errorNode = doc.getElementsByTagName('parsererror')[0];
        if (errorNode) {
            throw new Error('Failed to parse XML: ' + errorNode.textContent.trim());
        }
        return doc;
    }

    /**
     * Parse an ENA PROJECT_SET XML document (e.g. PRJNA940723.xml) into JSON.
     *
     * @param {string} xmlString - Raw XML file content.
     * @returns {Object} Parsed project record, e.g.:
     * {
     *   accession, alias, centerName, brokerName, name, title, description,
     *   identifiers: { primaryId, secondaryIds: [], externalIds: [{namespace, id}], submitterIds: [{namespace, id}] },
     *   organism: { taxonId, scientificName },
     *   relatedProjects: [accession, ...],
     *   links: [{ db, id }],
     *   attributes: [{ tag, value }]
     * }
     */
    function parseEnaProjectXml(xmlString) {
        const doc = parseXmlString(xmlString);
        const project = doc.getElementsByTagName('PROJECT')[0];
        if (!project) {
            throw new Error('No PROJECT element found in XML');
        }

        const identifiersEl = project.getElementsByTagName('IDENTIFIERS')[0];
        /*
        const identifiers = {
            primaryId: getText(identifiersEl, 'PRIMARY_ID'),
            secondaryIds: getAll(identifiersEl, 'SECONDARY_ID').map((el) => el.textContent.trim()),
            externalIds: getAll(identifiersEl, 'EXTERNAL_ID').map((el) => ({
                namespace: el.getAttribute('namespace'),
                id: el.textContent.trim(),
            })),
            submitterIds: getAll(identifiersEl, 'SUBMITTER_ID').map((el) => ({
                namespace: el.getAttribute('namespace'),
                id: el.textContent.trim(),
            })),
        };
        */
        let accessions = [];
        accessions.push(project.getAttribute('accession'));
        accessions.push(project.getAttribute('alias'));
        accessions.push(getText(identifiersEl, 'PRIMARY_ID'));
        accessions.push(...getAll(identifiersEl, 'SECONDARY_ID').map((el) => el.textContent.trim()));
        accessions.push(...getAll(identifiersEl, 'EXTERNAL_ID').map((el) => el.textContent.trim()));
        accessions = accessions.filter(x => x != null && x !== "");
        accessions = uniquesInArray(accessions);

        const organismEl = project.getElementsByTagName('ORGANISM')[0];
        const organism = organismEl
            ? {
                "Organism Taxon ID": getText(organismEl, 'TAXON_ID'),
                "Organism Name": getText(organismEl, 'SCIENTIFIC_NAME'),
            }
            : null;

        const relatedProjects = getAll(project, 'PARENT_PROJECT').map((el) => el.getAttribute('accession'));

        const links = getAll(project, 'XREF_LINK').map((el) => ({
            db: getText(el, 'DB'),
            id: getText(el, 'ID'),
        }));
        let pubmedLink = Object.entries(links).find(([_, link]) => link.db === 'PUBMED');
        if (pubmedLink) {
            pubmedLink = {"Pubmed": pubmedLink[1].id};
        } else {
            pubmedLink = {};
        }

        const attributes = Object.fromEntries(getAll(project, 'PROJECT_ATTRIBUTE').map((el) => [
            getText(el, 'TAG'),
            getText(el, 'VALUE')
        ]));

        return {
            //Accession: project.getAttribute('accession'),
            //Alias: project.getAttribute('alias'),
            Accessions: accessions,
            "Center Name": project.getAttribute('center_name'),
            //brokerName: project.getAttribute('broker_name'),
            Name: getText(project, 'NAME'),
            Title: getText(project, 'TITLE'),
            Description: getText(project, 'DESCRIPTION'),
            //Identifiers: identifiers,
            ...organism,
            "Related Projects": relatedProjects,
            //links,
            ...pubmedLink,
            ...attributes,
        };
    }

    /**
     * Parse an ENA SAMPLE_SET XML document (e.g. SAMN33578617.xml) into JSON.
     *
     * @param {string} xmlString - Raw XML file content.
     * @returns {Object} Parsed sample record, e.g.:
     * {
     *   accession, alias, centerName, brokerName, title,
     *   identifiers: { primaryId, secondaryIds: [], externalIds: [{namespace, id}], submitterIds: [{namespace, id}] },
     *   organism: { taxonId, scientificName, commonName },
     *   links: [{ db, id }],
     *   attributes: [{ tag, value }]
     * }
     */
    function parseEnaSampleXml(xmlString) {
        const doc = parseXmlString(xmlString);
        const sample = doc.getElementsByTagName('SAMPLE')[0];
        if (!sample) {
            throw new Error('No SAMPLE element found in XML');
        }

        const identifiersEl = sample.getElementsByTagName('IDENTIFIERS')[0];
        /*
        const identifiers = {
            primaryId: getText(identifiersEl, 'PRIMARY_ID'),
            secondaryIds: getAll(identifiersEl, 'SECONDARY_ID').map((el) => el.textContent.trim()),
            externalIds: getAll(identifiersEl, 'EXTERNAL_ID').map((el) => ({
                namespace: el.getAttribute('namespace'),
                id: el.textContent.trim(),
            })),
            submitterIds: getAll(identifiersEl, 'SUBMITTER_ID').map((el) => ({
                namespace: el.getAttribute('namespace'),
                id: el.textContent.trim(),
            })),
        };
        */
       let accessions = [];
       accessions.push(sample.getAttribute('accession'));
       accessions.push(sample.getAttribute('alias'));
       accessions.push(getText(identifiersEl, 'PRIMARY_ID'));
       accessions.push(...getAll(identifiersEl, 'SECONDARY_ID').map((el) => el.textContent.trim()));
       accessions.push(...getAll(identifiersEl, 'EXTERNAL_ID').map((el) => el.textContent.trim()));
       accessions = accessions.filter(x => x != null && x !== "");
       accessions = uniquesInArray(accessions);

        const sampleNameEl = sample.getElementsByTagName('SAMPLE_NAME')[0];
        const organism = sampleNameEl
            ? {
                "Organism Taxon ID": getText(sampleNameEl, 'TAXON_ID'),
                "Organism Name": getText(sampleNameEl, 'SCIENTIFIC_NAME'),
                "Organism Common Name": getText(sampleNameEl, 'COMMON_NAME'),
            }
            : null;

        const links = getAll(sample, 'XREF_LINK').map((el) => ({
            db: getText(el, 'DB'),
            id: getText(el, 'ID'),
        }));

        const attributes = Object.fromEntries(getAll(sample, 'SAMPLE_ATTRIBUTE').map((el) => [
            getText(el, 'TAG'),
            getText(el, 'VALUE'),
        ]));

        return {
            //Accession: sample.getAttribute('accession'),
            //Alias: sample.getAttribute('alias'),
            Accessions: accessions,
            "Center Name": sample.getAttribute('center_name'),
            //brokerName: sample.getAttribute('broker_name'),
            Title: getText(sample, 'TITLE'),
            //Identifiers: identifiers,
            ...organism,
            //links,
            ...attributes,
        };
    }

    return {
        parseEnaProjectXml,
        parseEnaSampleXml,
    };

})();


function formatBytes(bytes) {
    return `${formatNumber(bytes, {notation: "si", precision: 0.01, thousands: ","})}B`;
}


function formatDuration(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return "";
    seconds = Math.round(seconds);
    if (seconds < 60) return `${seconds}s`;
    let minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m${String(seconds % 60).padStart(2, "0")}s`;
    let hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h${String(minutes % 60).padStart(2, "0")}m`;
    return `${Math.floor(hours / 24)}d${String(hours % 24).padStart(2, "0")}h`;
}


class Downloader {
    constructor() {
        this.tasks = [];
        this.taskDivs = new Map();
        this.updateModelInterval = null;
    }
    async download(url, {name}={}) {
        if (!window.showSaveFilePicker) return null;
        let suggestedName = name ?? url.split("?")[0].split("/").pop();
        let startIn = "downloads";
        let handle;
        try {
            handle = await window.showSaveFilePicker({suggestedName, startIn});
        } catch (error) {
            return null; // user cancelled the picker
        }
        let task = {
            url,
            name: handle.name || suggestedName,
            status: "downloading",
            loaded: 0,
            total: null,
            speed: null,
            error: null,
            controller: new AbortController(),
            startDate: Date.now(),
            endDate: null,
            speedDate: Date.now(),
            speedLoaded: 0,
        };
        this.tasks.push(task);
        this.updateCounter();
        try {
            let response = await fetch(url, {signal: task.controller.signal});
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
            let total = Number(response.headers.get("Content-Length"));
            task.total = (Number.isFinite(total) && total > 0) ? total : null;
            let counter = new TransformStream({
                transform: (chunk, controller) => {
                    task.loaded += chunk.byteLength;
                    controller.enqueue(chunk);
                },
            });
            let writable = await handle.createWritable();
            await response.body
                .pipeThrough(counter)
                .pipeTo(writable, {signal: task.controller.signal});
            task.status = "done";
            task.total = task.loaded;
        } catch (error) {
            task.status = task.controller.signal.aborted ? "cancelled" : "error";
            task.error = error?.message ?? String(error);
        }
        task.endDate = Date.now();
        task.speed = null;
        this.updateCounter();
        return task;
    }
    cancel(task) {
        if (task.status === "downloading") task.controller.abort();
    }
    remove(task) {
        this.cancel(task);
        let index = this.tasks.indexOf(task);
        if (index !== -1) this.tasks.splice(index, 1);
        this.updateCounter();
    }
    retry(task) {
        this.remove(task);
        return this.download(task.url, {name: task.name});
    }
    clearFinished() {
        for (let task of this.tasks.slice()) {
            if (task.status !== "downloading") this.remove(task);
        }
    }
    updateCounter() {
        let now = Date.now();
        let completion = {total: 0, loaded: 0};
        for (let task of this.tasks) {
            if (task.status !== "downloading") continue;
            completion.total += (task.total ?? NaN);
            completion.loaded += task.loaded;
            let elapsed = (now - task.speedDate) / 1000;
            if (elapsed < 0.5) continue;
            let speed = (task.loaded - task.speedLoaded) / elapsed;
            task.speed = (task.speed == null) ? speed : 0.7 * task.speed + 0.3 * speed;
            task.speedDate = now;
            task.speedLoaded = task.loaded;
        }
        let downloading = this.tasks.filter(task => task.status === "downloading").length;
        let controlDiv = document.querySelector("#download-control");
        let donwloadSymbol = "download";
        if (downloading > 0) {
            if (completion.total > 0) {
                let ratio = Math.floor(10 * completion.loaded / completion.total) * 10;
                donwloadSymbol =
                    ratio === 0 ? "circle" :
                    ratio === 30 ? "clock_loader_20" :
                    ratio === 50 ? "clock_loader_40" :
                    ratio === 70 ? "clock_loader_60" :
                    ratio === 100 ? "clock_loader_90" :
                    `clock_loader_${ratio}`;
            } else {
                donwloadSymbol = "downloading";
            }
        }
        controlDiv.dataset.symbol = donwloadSymbol;
        controlDiv.dataset.error = this.tasks.some(task => task.status === "error") ? "true" : "false";
        document.querySelector("#current-download-count").textContent = (downloading > 0) ? `${downloading}\u00A0` : "";
        document.querySelector("#current-download-label").textContent = (downloading === 1) ? "Download" : "Downloads";
    }
    showModal() {
        document.querySelector("#download-modal").dataset.visible = "true";
        this.updateModal();
        if (!this.updateModelInterval) {
            this.updateModelInterval = setInterval(() => this.updateModal(), 200);
        }
    }
    hideModal() {
        document.querySelector("#download-modal").dataset.visible = "false";
        if (this.updateModelInterval) {
            clearInterval(this.updateModelInterval);
            this.updateModelInterval = null;
        }
    }
    updateModal() {
        let list = document.querySelector("#download-modal > .panel > .list");
        for (let [task, taskDiv] of this.taskDivs) {
            if (this.tasks.includes(task)) continue;
            taskDiv.remove();
            this.taskDivs.delete(task);
        }
        for (let task of this.tasks) {
            let taskDiv = this.taskDivs.get(task);
            if (!taskDiv) {
                taskDiv = this.makeTaskDiv(task);
                this.taskDivs.set(task, taskDiv);
            }
            if (taskDiv.parentElement !== list) list.appendChild(taskDiv);
            this.updateTaskDiv(task, taskDiv);
        }
    }
    makeTaskDiv(task) {
        let taskDiv = document.createElement("div");
        taskDiv.classList.add("task", "appear-smoothly");

        let headerDiv = taskDiv.appendChild(document.createElement("div"));
        headerDiv.classList.add("header");
        let nameDiv = headerDiv.appendChild(document.createElement("div"));
        nameDiv.classList.add("name");
        nameDiv.textContent = task.name;
        nameDiv.title = task.url;

        let barDiv = taskDiv.appendChild(document.createElement("div"));
        barDiv.classList.add("bar");
        barDiv.appendChild(document.createElement("div"));

        let detailsDiv = taskDiv.appendChild(document.createElement("div"));
        detailsDiv.classList.add("details");
        detailsDiv.appendChild(document.createElement("div")).classList.add("status");
        for (let [className, symbol, label, onclick] of [
            ["cancel", "close", "Cancel", () => this.cancel(task)],
            ["retry", "refresh", "Retry", () => this.retry(task)],
            ["remove", "delete", "Remove", () => this.remove(task)],
        ]) {
            let actionDiv = detailsDiv.appendChild(document.createElement("div"));
            actionDiv.classList.add(className, "symbol-left", "symbol-colored");
            actionDiv.dataset.symbol = symbol;
            actionDiv.textContent = label;
            actionDiv.onclick = () => {
                onclick();
                this.updateModal();
            };
        }
        return taskDiv;
    }
    updateTaskDiv(task, taskDiv) {
        let ratio = (task.total != null) ? Math.min(1, task.loaded / task.total) : null;
        let indeterminate = (task.status === "downloading") && (ratio == null);
        taskDiv.dataset.status = task.status;
        taskDiv.dataset.indeterminate = indeterminate ? "true" : "false";

        let fillDiv = taskDiv.querySelector(".bar > div");
        fillDiv.style.width = indeterminate ? "" : `${100 * ((task.status === "done") ? 1 : (ratio ?? 0))}%`;

        let parts = [];
        if (task.status === "downloading") {
            if (ratio != null) parts.push(`${Math.floor(100 * ratio)} %`);
            parts.push((task.total != null)
                ? `${formatBytes(task.loaded)} / ${formatBytes(task.total)}`
                : formatBytes(task.loaded));
            if (task.speed) {
                parts.push(`${formatBytes(task.speed)}/s`);
                if (task.total != null) {
                    let eta = formatDuration((task.total - task.loaded) / task.speed);
                    if (eta) parts.push(`${eta} left`);
                }
            }
        } else if (task.status === "done") {
            parts.push("Done");
            parts.push(formatBytes(task.loaded));
            let duration = formatDuration((task.endDate - task.startDate) / 1000);
            if (duration) parts.push(`in ${duration}`);
        } else if (task.status === "cancelled") {
            parts.push(`Cancelled after ${formatBytes(task.loaded)}`);
        } else {
            parts.push("Failed");
            parts.push(task.error || "Unknown error");
        }
        parts = parts.join(" · ");
        taskDiv.querySelector(".status").textContent = parts;
    }
}
STATE.downloader = new Downloader();
setInterval(() => STATE.downloader.updateCounter(), 200);


async function main() {

    STATE.infiniteScrolling.samples = setupInfiniteScroll(
        document.querySelector("#samples-list-wrapper"),
        () => showMoreSamples(),
        () => STATE.current.samples.count != null
            && STATE.current.samples.count < STATE.current.samples.list.length,
    );
    STATE.infiniteScrolling.listing = setupInfiniteScroll(
        document.querySelector("#listing"),
        () => showMoreListing(),
        () => STATE.current.listing.target != null
            && STATE.current.listing.count < STATE.current.listing.list.length,
    );

    for (let div of document.querySelectorAll("#search-fields-control > div:not(:nth-child(1))")) {
        div.onclick = async () => {
            if (div.dataset.checked === "true") {
                div.dataset.checked = "false";
            } else {
                div.dataset.checked = "true";
            }
            await searchSamples();
        };
    }

    document.querySelector("#download-modal").onclick = event => {
        if (event.target === event.currentTarget) STATE.downloader.hideModal();
    };
    document.querySelector("#download-modal-close").onclick = () => STATE.downloader.hideModal();
    document.querySelector("#download-modal-clear").onclick = () => STATE.downloader.clearFinished();
    document.addEventListener("keydown", event => {
        if (event.key === "Escape") STATE.downloader.hideModal();
    });

    await getAvailableGenomes();
    await searchSamples();

}

main();
